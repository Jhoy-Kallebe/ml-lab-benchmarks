apiVersion: v1
kind: Pod
metadata:
  name: llama-spec-model-loader
  namespace: ml-lab
  labels:
    app: llama-spec-model-loader
spec:
  restartPolicy: Always
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 86400"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
      volumeMounts:
        - name: models
          mountPath: /models
  volumes:
    - name: models
      persistentVolumeClaim:
        claimName: llama-spec-models
